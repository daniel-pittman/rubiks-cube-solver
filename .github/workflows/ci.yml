# Continuous integration: lint, format-check, and run the test suite.
#
# This workflow needs NO secrets and is safe to run on every push and PR,
# including PRs from forks. The secret-sensitive Claude review workflows are
# separate files.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      # SHA-pinned actions/checkout v6.0.2
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # SHA-pinned actions/setup-python v6.2.0
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      # The desktop extra (PySide6 / PyOpenGL) is intentionally NOT installed
      # in CI — it pulls a Qt runtime and OpenGL system libraries that the
      # headless ubuntu-latest runner doesn't have. The core, web, and dev
      # extras together exercise everything CI needs to verify (linting, the
      # solver/core test suite, the Flask web layer).
      - name: Install the project and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[web,dev]"

      - name: Black formatter check
        run: black --check solver/

      - name: Autoflake check
        run: autoflake --check --remove-unused-variables --remove-all-unused-imports --recursive solver/

      - name: Isort import order check
        run: isort --check-only --profile black solver/

      - name: Pylint static analysis
        run: pylint --fail-under=9 solver/

      - name: Run the test suite
        run: pytest
